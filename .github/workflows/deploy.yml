name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: snake
      
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - run: npm install
        working-directory: ./snake
      
      - run: npm run build
        working-directory: ./snake
        env:
          GITHUB_REPOSITORY: cv-sreeram/cv-sreeram.github.io
      
      - uses: actions/checkout@v3
        with:
          repository: cv-sreeram/cv-sreeram.github.io
          token: ${{ secrets.GITHUB_TOKEN }}
          path: cv-site
      
      - run: rm -rf cv-site/snake && cp -r snake/dist cv-site/snake
      
      - run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add snake/
          git commit -m "Deploy Snake game: ${{ github.sha }}" || echo "No changes to commit"
          git push
        working-directory: ./cv-site
