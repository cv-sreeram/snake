name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: snake
      
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      
      - run: npm install
        working-directory: ./snake
      
      - run: npm run build
        working-directory: ./snake
        env:
          VITE_BASE: /snake/
      
      - uses: actions/checkout@v3
        with:
          repository: cv-sreeram/cv-sreeram.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: cv-site
      
      - run: |
          cat > cv-site/.gitattributes << 'EOF'
          * text=auto
          *.js text eol=lf
          *.css text eol=lf
          *.html text eol=lf
          *.json text eol=lf
          *.svg text eol=lf
          EOF
          cd cv-site
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .gitattributes
          git commit -m "Update gitattributes" || echo "No changes"
          git push
        
      - run: rm -rf cv-site/snake && cp -r snake/dist cv-site/snake
      
      - run: |
          cd cv-site
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add snake/
          git commit -m "Deploy Snake game: ${{ github.sha }}" || echo "No changes to commit"
          git push
